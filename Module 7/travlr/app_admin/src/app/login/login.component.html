<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <h1 class="h2 mb-4">Sign In</h1>
    <form (ngSubmit)="onLoginSubmit()" class="card shadow-sm">
      <div class="card-body p-4">
        <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input id="name" name="name" type="text" class="form-control" [(ngModel)]="credentials.name">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" [(ngModel)]="credentials.email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" [(ngModel)]="credentials.password">
        </div>
      </div>
      <div class="card-footer bg-white text-end p-3">
        <button type="submit" class="btn btn-primary">Sign In</button>
      </div>
    </form>
  </div>
</div>
