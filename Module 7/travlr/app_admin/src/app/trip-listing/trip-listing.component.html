<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
  <div>
    <h1 class="h2 mb-1">Available Trips</h1>
    <p class="text-secondary mb-0">Manage the current Travlr Getaways packages.</p>
  </div>
  <a *ngIf="isLoggedIn()" class="btn btn-primary" routerLink="/add-trip">Add Trip</a>
</div>

<div *ngIf="message" class="alert alert-warning" role="alert">{{ message }}</div>

<div class="row g-4" *ngIf="trips.length">
  <div class="col-md-6 col-lg-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (deleteRequested)="deleteTrip($event)"></app-trip-card>
  </div>
</div>

<div *ngIf="!message && !trips.length" class="alert alert-info">
  No trips are currently available.
</div>
